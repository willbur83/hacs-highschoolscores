name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer1:
    name: Layer 1 (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest

  frontend:
    name: Frontend unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: npm ci
        run: npm ci
        working-directory: frontend
      - name: npm test
        run: npm test
        working-directory: frontend

  layer2:
    name: Layer 2 (HA Core container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical Layer 2 pytest in homeassistant:2026.9.0
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            ghcr.io/home-assistant/home-assistant:2026.9.0 bash -lc '
          python3 -m pip install pytest-homeassistant-custom-component==0.13.362
          python3 -m pip install homeassistant==2026.9.0
          python3 -m pip install -e .
          PYTHONPATH=/work python3 -m pytest --import-mode=importlib --rootdir=/work \
            tests/test_manifest.py tests/test_init.py tests/test_ha_transport.py \
            tests/test_config_flow.py tests/test_programs.py tests/test_coordinator.py \
            tests/test_sensor.py tests/test_options_flow.py tests/test_multi_school.py \
            tests/test_failure.py tests/test_rollover.py tests/test_websocket.py
          '

  packaging:
    name: Packaging dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build frontend bundle
        run: npm ci && npm run build
        working-directory: frontend
      - name: Pack release zip
        run: bash scripts/ci/pack_release_zip.sh
      - name: Assert release zip layout
        run: bash scripts/ci/assert_release_zip.sh

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
